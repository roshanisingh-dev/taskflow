<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Organize Your Tasks</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <main class="container">

     <!-- Header -->
     <header class="header">
         <div class="logo">
             <i class="fa-solid fa-list-check"></i>
             <h1>TaskFlow</h1>
         </div>
         <p class="subtitle">
             Stay organized. Stay productive.
         </p>
     </header>

     <!-- Search -->
     <section class="search-section">
         <div class="search-box">
             <i class="fa-solid fa-magnifying-glass"></i>
             <input
                type="text"
                id="searchInput"
                placeholder="Search your tasks..."
             >
         </div>

     </section>

     <!-- Add Task -->
     <section class="task-form">
        <form id="taskForm" class="form-group">
             <label for="taskInput" class="sr-only">Task Name</label>
             <input
                type="text"
                id="taskInput"
                maxlength="100"
                placeholder="Enter a new task..."
             >

             <select id="priority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
             </select>

             <input type="date" id="dueDate">

             <button type="submit" id="addTaskBtn">
                 <i class="fa-solid fa-plus"></i>
                 Add Task
             </button>
        </form>
     </section>


     <!-- Filters -->
     <section class="filter-section">
         <button class="filter-btn active" data-filter="all">
             All
          </button>

          <button class="filter-btn" data-filter="pending">
              Pending
          </button>

          <button class="filter-btn" data-filter="completed">
             Completed
         </button>
      </section>

     <!-- Task List -->
     <section class="task-list" id="taskList">
           <div class="empty-state" id="emptyState">
                <i class="fa-regular fa-clipboard"></i>
                <h3>No Tasks Yet</h3>
                <p>Add your first task to get started.</p>
         </div>
     </section>

     <!-- Statistics -->
     <section class="stats">
          <div class="stat-card">
              <h2 id="totalTasks">0</h2>
              <p>Total Tasks</p>
          </div>

          <div class="stat-card">
             <h2 id="completedTasks">0</h2>
             <p>Completed</p>
          </div>

           <div class="stat-card">
              <h2 id="pendingTasks">0</h2>
              <p>Pending</p>
          </div>
     </section>
 </main>

    <script src="script.js"></script>
</body>
</html>
